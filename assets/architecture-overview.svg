<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 8px; }
      .box-highlight { fill: #161b22; stroke: #58a6ff; stroke-width: 2; rx: 8px; }
      .title { fill: #58a6ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 16px; font-weight: 600; }
      .label { fill: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; font-weight: 500; }
      .subtext { fill: #8b949e; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
      .code { fill: #79c0ff; font-family: "SFMono-Regular", Consolas, monospace; font-size: 11px; }
      .arrow { stroke: #58a6ff; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .badge-green { fill: #238636; }
      .badge-blue { fill: #1f6feb; }
      .badge-purple { fill: #8957e5; }
      .badge-text { fill: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 600; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#58a6ff" />
    </marker>
  </defs>

  <rect width="1000" height="480" class="bg" rx="12" />

  <text x="40" y="45" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700">Parity Guard: Behavioral Parity &amp; Differential Testing Architecture</text>
  <text x="40" y="68" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Deterministic Golden Tracing, Dynamic Masking Normalization, and Automated CI/CD Parity Scoring</text>

  <!-- Stage 1: Golden Trace -->
  <g transform="translate(40, 100)">
    <rect width="270" height="330" class="box" />
    <rect x="15" y="15" width="70" height="18" rx="4" class="badge-blue" />
    <text x="50" y="27" class="badge-text">STAGE 1</text>
    <text x="15" y="55" class="title">Golden Trace Recorder</text>
    <text x="15" y="75" class="subtext">Deterministic Baseline Capture</text>

    <rect x="15" y="95" width="240" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="115" class="label">Legacy Execution Capture</text>
    <text x="25" y="132" class="subtext">• Python / Node / C++ runtime</text>
    <text x="25" y="147" class="subtext">• stdin, argv, env, stdout, exit_code</text>

    <rect x="15" y="175" width="240" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="195" class="label">Portable Golden Traces</text>
    <text x="25" y="212" class="code">suite.record(binary, inputs)</text>
    <text x="25" y="227" class="subtext">• Immutable behavioral snapshots</text>

    <rect x="15" y="255" width="240" height="55" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="275" class="label">Zero External Dependencies</text>
    <text x="25" y="292" class="subtext">• 100% Python Standard Library</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <path d="M 310 250 L 350 250" class="arrow" />

  <!-- Stage 2: Normalization -->
  <g transform="translate(360, 100)">
    <rect width="280" height="330" class="box-highlight" />
    <rect x="15" y="15" width="70" height="18" rx="4" class="badge-purple" />
    <text x="50" y="27" class="badge-text">STAGE 2</text>
    <text x="15" y="55" class="title">Smart Normalization</text>
    <text x="15" y="75" class="subtext">Volatile Token Masking</text>

    <rect x="15" y="95" width="250" height="75" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="115" class="label">Dynamic Token Normalizer</text>
    <text x="25" y="132" class="code">&lt;TIMESTAMP_RFC3339&gt;</text>
    <text x="25" y="147" class="code">&lt;UUID_V4&gt; &lt;TMP_PATH&gt;</text>

    <rect x="15" y="180" width="250" height="75" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="200" class="label">Semantic JSON Comparator</text>
    <text x="25" y="218" class="code">float_tolerance: 1e-6</text>
    <text x="25" y="235" class="subtext">• Unordered object key invariance</text>

    <rect x="15" y="265" width="250" height="45" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="285" class="label">Noise Elimination</text>
    <text x="25" y="298" class="subtext">• Prevents false-negative test failures</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <path d="M 640 250 L 680 250" class="arrow" />

  <!-- Stage 3: CI Gate -->
  <g transform="translate(690, 100)">
    <rect width="270" height="330" class="box" />
    <rect x="15" y="15" width="70" height="18" rx="4" class="badge-green" />
    <text x="50" y="27" class="badge-text">STAGE 3</text>
    <text x="15" y="55" class="title">Parity Score &amp; CI Gate</text>
    <text x="15" y="75" class="subtext">Continuous Verification Engine</text>

    <rect x="15" y="95" width="240" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="115" class="label">Candidate Port Verification</text>
    <text x="25" y="132" class="subtext">• Rust / Go / Zig rewrite binary</text>
    <text x="25" y="147" class="subtext">• Concurrent differential runner</text>

    <rect x="15" y="175" width="240" height="70" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="195" class="label">Automated Parity Scoring</text>
    <text x="25" y="212" class="code">Parity: 100.0% [PASSED]</text>
    <text x="25" y="227" class="subtext">• Line-by-line unified diff output</text>

    <rect x="15" y="255" width="240" height="55" rx="6" fill="#21262d" stroke="#30363d" />
    <text x="25" y="275" class="label">GitHub Actions Quality Gate</text>
    <text x="25" y="292" class="subtext">• Exit 0 = Pass, Exit 1 = Breach</text>
  </g>
</svg>
